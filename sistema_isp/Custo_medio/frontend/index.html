<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ep Conexões - Custo Médio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/collapse.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/src/styles/styles.css">
    <style>
        /* Ajustes rápidos de cores para garantir o padrão Ep Conexões */
        body {
            background-color: #0b1329 !important; /* Azul escuro do painel */
            color: #f8fafc;
        }
        .card-custom {
            background-color: #111c44 !important; /* Fundo dos cards */
            border: 1px solid #1e293b;
            border-radius: 12px;
        }
        .text-lime {
            color: #a3e635 !important; /* Verde Limão padrão Ep Conexões */
        }
        .btn-calc {
            background-color: #0099ff !important;
            border: none;
            font-weight: bold;
        }
        .btn-calc:hover {
            background-color: #007acc !important;
        }
        .btn-process {
            background-color: #10b981 !important;
            border: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container py-5">
    
    <div class="text-center mb-5">
        <h1 class="text-lime fw-bold display-5">
            <i class="fa-solid fa-tower-broadcast me-2"></i>EP CONEXÕES & NEGÓCIOS
        </h1>
        <p class="text-lime fs-5">Painel de Análise de Custo Médio</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            
            <div class="card card-custom p-4 mb-4 shadow">
                <h3 class="card-title mb-4 text-lime fw-bold">Filtros de Pesquisa</h3>
                
                <form id="form-filtros" class="row g-3">
                    <div class="col-12 col-md-6">
                        <label class="form-label text-lime fw-bold">CIDADE</label> 
                        <input type="text" id="cidade" class="form-control bg-dark border-secondary">
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label text-lime fw-bold">UF</label>
                        <input type="text" id="uf" class="form-control bg-dark border-secondary">
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label text-lime fw-bold">TIPO DE SERVIÇO</label>
                        <select id="tipo_servico" class="form-select bg-dark border-secondary"></select>
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label text-lime fw-bold">VELOCIDADE (APENAS NÚMEROS)</label>
                        <input type="number" id="velocidade" class="form-control bg-dark border-secondary">
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label text-lime fw-bold">INTERFACE</label>
                        <select id="interface" class="form-select bg-dark border-secondary"></select>
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label text-lime fw-bold">IP FIXO</label>
                        <select id="ip_fixo" class="form-select bg-dark border-secondary"></select>
                    </div>
                    <div class="col-12">
                        <label class="form-label text-lime fw-bold">PRAZO CONTRATUAL (MESES)</label>
                        <select id="prazo" class="form-select bg-dark border-secondary"></select>
                    </div>
                    <button type="button" class="btn btn-calc text-white py-3 mt-4">
                        <i class="fa-solid fa-calculator me-2"></i>Calcular Custo Médio
                    </button>
                </form>
            </div>

            <div class="card card-custom p-4 mb-4 shadow border-secondary">
                <h3 class="card-title mb-2 text-lime fw-bold">Processar Planilha (Lote)</h3>
                <p class="text-lime small">Suba um CSV com colunas: cidade, uf, servico, velocidade</p>
                
                <input type="file" id="arquivo-csv" class="form-control bg-dark border-secondary mt-3" accept=".csv">
                
                <button type="button" id="btn-processar-lote" class="btn btn-process w-100 text-white py-3 mt-4 fw-bold">
                    <i class="fa-solid fa-file-excel me-2"></i>PROCESSAR E BAIXAR RESULTADOS
                </button>
            </div>

            <div class="row g-3">
                <div class="col-6">
                    <div class="card card-custom p-4 text-center shadow">
                        <span class="text-lime small fw-bold">MÉDIA ESTIMADA</span>
                        <h2 id="resultado-media" class="text-lime fw-bold mt-2">R$ 0,00</h2>
                    </div>
                </div>
                <div class="col-6">
                    <div class="card card-custom p-4 text-center shadow">
                        <span class="text-lime small fw-bold">AMOSTRAGEM</span>
                        <h2 id="resultado-amostragem" class="text-lime fw-bold mt-2">0</h2>
                    </div>
                </div>
            </div>
            
        </div>
    </div>
</div>

<script src="/static/src/services/script.js"></script>
</body>

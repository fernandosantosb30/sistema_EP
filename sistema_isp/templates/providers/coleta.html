{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card p-4">
            <h2 class="text-center mb-4">Coleta Inteligente de Dados</h2>
            <form method="POST" action="{% url 'coleta_dados' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Cole os dados do contrato aqui:</label>
                    <textarea name="texto_colado" rows="10" class="form-control" required placeholder="Ex: Cidade: Santa Maria/RS, Provedor: X, Serviço: Fibra, 500MB..."></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100">Extrair e Armazenar</button>
            </form>

            {% if sucesso %}
                <div class="alert alert-success mt-4">
                    <h4 class="alert-heading">Dados extraídos com sucesso!</h4>
                    <pre class="bg-dark text-white p-3">{{ dados }}</pre>
                </div>
            {% endif %}
            
            {% if erro %}
                <div class="alert alert-danger mt-4">
                    {{ erro }}
                </div>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}

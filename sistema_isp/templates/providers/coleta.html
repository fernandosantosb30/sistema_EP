<div class="container mt-4">
    <form method="POST" action="{% url 'coleta_dados' %}">
        {% csrf_token %}
        <h3>Coleta de Dados de Custo Médio</h3>
        <p>Cole a mensagem abaixo para extração automática:</p>
        
        <textarea name="texto_colado" rows="10" class="form-control" placeholder="Cole aqui os dados do contrato..."></textarea>
        
        <br>
        <button type="submit" class="btn btn-primary">Extrair e Armazenar</button>
    </form>

    {% if sucesso %}
        <div style="background-color: #d4edda; border: 1px solid #c3e6cb; padding: 15px; margin-top: 20px;">
            <h4 style="color: #155724;">Dados extraídos com sucesso!</h4>
            <pre style="background: #f8f9fa; padding: 10px;">{{ dados }}</pre>
        </div>
    {% endif %}
</div>

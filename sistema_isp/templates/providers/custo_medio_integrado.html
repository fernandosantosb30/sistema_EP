{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2 class="text-white mb-4"><i class="bi bi-calculator text-primary"></i> Painel de Análise de Custo Médio</h2>

    <div class="card bg-dark border-primary p-4">
        <h5 class="text-primary mb-3">Filtros de Pesquisa</h5>
        <form id="form-filtros" class="row g-3">
            <div class="col-md-6">
                <input type="text" id="cidade" name="cidade" class="form-control bg-dark text-white" placeholder="Ex: Santa Maria">
            </div>
            <div class="col-md-6">
                <input type="text" id="uf" name="uf" class="form-control bg-dark text-white" placeholder="UF">
            </div>
            
            <div class="col-md-6">
                <select id="tipo_servico" name="servico" class="form-select bg-dark text-white">
                <option value="">Tipo de Serviço (Todos)</option>
                {% for s in servicos %}
                    <option value="{{ s }}">{{ s }}</option>
                {% endfor %}
            </select>
            </div>
            <div class="col-md-6">
                <input type="number" id="velocidade" name="capacidade" class="form-control bg-dark text-white" placeholder="Velocidade (MB)">
            </div>

            <div class="col-md-6">
                <select id="interface" name="interface" class="form-select bg-dark text-white">
                    <option value="">Interface (Todos)</option>
                </select>
            </div>
            <div class="col-md-6">
                <select id="ip_fixo" name="ip_fixo" class="form-select bg-dark text-white">
                    <option value="">IP Fixo (Todos)</option>
                {% for ip in ips_fixos %}
                    <option value="{{ ip }}">{{ ip }}</option>
                {% endfor %}
            </select>
            </div>
            <div class="col-md-12">
                <select id="prazo" name="vigencia" class="form-select bg-dark text-white">
                    <option value="">Prazo Contratual (Meses)</option>
                    {% for v in vigencias %}
                        <option value="{{ v }}">{{ v }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-12 mt-3">
                <button type="button" id="btn-calcular" class="btn btn-primary w-100 fw-bold">
                    <i class="bi bi-calculator"></i> Calcular Custo Médio
                </button>
            </div>
        </form>
    </div>

    <div class="card bg-dark border-success p-4 mt-4">
        <h5 class="text-success mb-3"><i class="bi bi-file-earmark-excel"></i> Processar Planilha (Lote)</h5>
        <p class="text-white-50 small mb-3">Suba um CSV com as colunas: <b>cidade, uf, servico, velocidade</b></p>
        
        <div class="row g-3 align-items-center">
            <div class="col-md-9">
                <input type="file" id="arquivo-csv" class="form-control bg-dark text-white border-secondary" accept=".csv" required>
            </div>
            <div class="col-md-3">
                <button type="button" id="btn-processar-lote" class="btn btn-success w-100 fw-bold">
                    <i class="bi bi-download"></i> PROCESSAR E BAIXAR
                </button>
            </div>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-md-6">
            <div class="card bg-dark border-success p-3 text-center">
                <h6 class="text-success">Média Estimada</h6>
                <h3 id="resultado-media" class="text-white">R$ 0,00</h3>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card bg-dark border-info p-3 text-center">
                <h6 class="text-info">Amostragem</h6>
                <h3 id="resultado-amostragem" class="text-white">0 contratos</h3>
            </div>
        </div>
    </div>

    <div id="alerta-regional" class="alert alert-warning mt-3 d-none">
        <span id="texto-alerta"></span>
    </div>
</div>

<script>
document.getElementById('btn-calcular').addEventListener('click', function() {
    const params = new URLSearchParams({
        cidade: document.getElementById('cidade').value,
        uf: document.getElementById('uf').value,
        servico: document.getElementById('tipo_servico').value,
        capacidade: document.getElementById('velocidade').value,
        vigencia: document.getElementById('prazo').value,
        ip_fixo: document.getElementById('ip_fixo').value
    });

    fetch(`/custo-medio/?${params.toString()}`)
    .then(res => {
        if (!res.ok) throw new Error('Erro no servidor');
        return res.json();
    })
    .then(data => {
        document.getElementById('resultado-media').innerText = 'R$ ' + (data.custo_medio || 0).toFixed(2);
        document.getElementById('resultado-amostragem').innerText = (data.quantidade_contratos || 0) + ' contratos';
    })
    .catch(err => {
        console.error(err);
        alert('Erro ao calcular custo. Verifique os filtros.');
    });
});
</script>

{% endblock %}

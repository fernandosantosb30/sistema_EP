{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2 class="text-white mb-4"><i class="bi bi-calculator text-primary"></i> Painel de Análise de Custo Médio</h2>

    <div class="card bg-dark border-primary p-4">
        <h5 class="text-primary mb-3">Filtros de Pesquisa</h5>
        <form method="GET" action="{% url 'processar_custo_medio' %}" class="row g-3">
            <div class="col-md-6">
                <input type="text" name="cidade" class="form-control bg-dark text-white" placeholder="Ex: Santa Maria" value="{{ request.GET.cidade }}">
            </div>
            <div class="col-md-6">
                <input type="text" name="uf" class="form-control bg-dark text-white" placeholder="UF" value="{{ request.GET.uf }}">
            </div>
            
            <div class="col-md-6">
                <select name="servico" class="form-select bg-dark text-white">
                    <option value="">Tipo de Serviço (Todos)</option>
                    <option value="Fibra" {% if request.GET.servico == 'Fibra' %}selected{% endif %}>Fibra</option>
                    <option value="Radio" {% if request.GET.servico == 'Radio' %}selected{% endif %}>Radio</option>
                </select>
            </div>
            <div class="col-md-6">
                <input type="number" name="capacidade" class="form-control bg-dark text-white" placeholder="Velocidade (MB)" value="{{ request.GET.capacidade }}">
            </div>

            <div class="col-md-6">
                <select name="interface" class="form-select bg-dark text-white">
                    <option value="">Interface (Todos)</option>
                </select>
            </div>
            <div class="col-md-6">
                <select name="ip_fixo" class="form-select bg-dark text-white">
                    <option value="">IP Fixo (Todos)</option>
                </select>
            </div>
            <div class="col-md-12">
                <select name="vigencia" class="form-select bg-dark text-white">
                    <option value="">Prazo Contratual (Meses)</option>
                </select>
            </div>

            <div class="col-12 mt-3">
                <button type="submit" class="btn btn-primary w-100 fw-bold">
                    <i class="bi bi-calculator"></i> Calcular Custo Médio
                </button>
            </div>
        </form>
    </div>

    {% if custo_medio is not None %}
    <div class="row mt-4">
        <div class="col-md-6">
            <div class="card bg-dark border-success p-3 text-center">
                <h6 class="text-success">Média Estimada</h6>
                <h3 class="text-white">R$ {{ custo_medio }}</h3>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card bg-dark border-info p-3 text-center">
                <h6 class="text-info">Amostragem</h6>
                <h3 class="text-white">{{ quantidade_contratos }} contratos</h3>
            </div>
        </div>
    </div>
    {% endif %}

    <div class="card bg-dark border-success p-4 mt-4">
        <h5 class="text-success mb-3"><i class="bi bi-file-earmark-excel"></i> Processar Planilha (Lote)</h5>
        <form method="POST" action="{% url 'processar_lote' %}" enctype="multipart/form-data" class="row g-3 align-items-center">
            {% csrf_token %}
            <div class="col-md-9">
                <input type="file" name="arquivo_cidades" class="form-control bg-dark text-white border-secondary" accept=".csv" required>
            </div>
            <div class="col-md-3">
                <button type="submit" class="btn btn-success w-100 fw-bold">
                    <i class="bi bi-download"></i> PROCESSAR E BAIXAR
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

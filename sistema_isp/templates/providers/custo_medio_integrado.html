{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2 class="text-white mb-4"><i class="bi bi-calculator text-primary"></i> Painel de Análise de Custo Médio</h2>

    <div class="card bg-dark border-primary p-4">
        <h5 class="text-primary mb-3">Filtros de Pesquisa</h5>
        <form id="form-filtros" class="row g-3">
            <div class="col-md-6">
                <input type="text" id="cidade" name="cidade" class="form-control bg-dark text-white" placeholder="Cidade (Ex: Santa Maria)">
            </div>
            <div class="col-md-6">
                <input type="text" id="uf" name="uf" class="form-control bg-dark text-white" placeholder="UF (Ex: RS)">
            </div>
            
            <div class="col-md-6">
                <select id="tipo_servico" name="tipo_servico" class="form-select bg-dark text-white">
                    <option value="">Tipo de Serviço (Todos)</option>
                    {% for s in servicos %}
                        <option value="{{ s }}">{{ s }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <input type="number" id="velocidade" name="velocidade" class="form-control bg-dark text-white" placeholder="Velocidade (MB)">
            </div>

            <div class="col-md-6">
                <select id="meio_fisico" name="meio_fisico" class="form-select bg-dark text-white">
                    <option value="">Meio Físico (Todos)</option>
                    {% for m in meios_fisicos %}
                        <option value="{{ m }}">{{ m }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <select id="ip_fixo" name="ip_fixo" class="form-select bg-dark text-white">
                    <option value="">IP Fixo (Todos)</option>
                    {% for ip in ips_fixos %}
                        <option value="{{ ip }}">{{ ip }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-12">
                <select id="prazo" name="mensal" class="form-select bg-dark text-white">
                    <option value="">Prazo Contratual (Meses)</option>
                    {% for v in vigencias %}
                        <option value="{{ v }}">{{ v }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-12 mt-3">
                <button type="button" id="btn-calcular" class="btn btn-primary w-100 fw-bold">
                    <i class="bi bi-calculator"></i> Calcular Custo Médio
                </button>
            </div>
        </form>
    </div>

    <div class="card bg-dark border-success p-4 mt-4">
        <h5 class="text-success mb-3"><i class="bi bi-file-earmark-excel"></i> Processar Planilha (Lote)</h5>
        <p class="text-white-50 small mb-3">Colunas esperadas: <b>cidade, uf, tipo_servico, velocidade</b></p>
        <div class="row g-3 align-items-center">
            <div class="col-md-9">
                <input type="file" id="arquivo-csv" class="form-control bg-dark text-white border-secondary" accept=".csv" required>
            </div>
            <div class="col-md-3">
                <button type="button" id="btn-processar-lote" class="btn btn-success w-100 fw-bold">
                    <i class="bi bi-download"></i> PROCESSAR LOTE
                </button>
            </div>
        </div>
    </div>
    
    <div class="row mt-4">
        <div class="col-md-6">
            <div class="card bg-dark border-success p-3 text-center">
                <h6 class="text-success">Média Estimada</h6>
                <h3 id="resultado-media" class="text-white">R$ 0,00</h3>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card bg-dark border-info p-3 text-center">
                <h6 class="text-info">Amostragem</h6>
                <h3 id="resultado-amostragem" class="text-white">0 contratos</h3>
            </div>
        </div>
    </div>
</div>

<script>
// ... (mantenha a lógica de getCookie)

document.getElementById('btn-calcular').addEventListener('click', function() {
    const params = new URLSearchParams({
        cidade: document.getElementById('cidade').value.trim(),
        uf: document.getElementById('uf').value.trim(),
        tipo_servico: document.getElementById('tipo_servico').value,
        velocidade: document.getElementById('velocidade').value,
        meio_fisico: document.getElementById('meio_fisico').value,
        ip_fixo: document.getElementById('ip_fixo').value,
        prazo: document.getElementById('prazo').value
    });

    // ... (restante do seu fetch de cálculo)
});

document.getElementById('btn-processar-lote').addEventListener('click', function() {
    // ... (lógica de envio de formulário para /custo-medio/processar-lote/)
});
</script>
{% endblock %}
